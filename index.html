<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- 메인 프로필 카드 (화면 중앙 정렬) -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 md:p-10 text-center border border-slate-100 transition-all">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <img 
                src="나의포토0819.png" 
                alt="프로필 사진" 
                class="w-full h-full rounded-full object-cover shadow-md border-4 border-white"
                onerror="this.onerror=null; this.src='https://placehold.co/160x160/e2e8f0/475569?text=Profile';"
            />
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            라디오 김
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-sm md:text-base font-semibold text-indigo-600 mb-6 bg-indigo-50 inline-block px-3 py-1 rounded-full">
            만나서 반갑습니다
        </p>

        <!-- 4. 3~4줄 정도의 짧은 자기소개 -->
        <div class="text-slate-600 leading-relaxed text-sm md:text-base space-y-2 text-left bg-slate-50 p-5 rounded-xl border border-slate-100">
            <p>
                안녕하세요! 사용자 경험을 개선하고 깔끔한 코드 작성을 즐기는 개발자입니다. 새로운 기술을 탐구하고 서비스의 디테일을 다듬는 과정에서 큰 보람을 느낍니다.
            </p>
            <p>
                동료들과의 원활한 소통을 중요하게 생각하며, 언제나 더 나은 해결책을 찾기 위해 고민합니다.
            </p>
        </div>

    </main>

</body>
</html>
